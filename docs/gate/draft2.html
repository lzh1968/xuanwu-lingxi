<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#08090b">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<title>玄武灵犀 · 常驻门</title>
<style>
  /* ─────────────────────────────────────────────
     玄武灵犀 · 内门（文字版 · 古朴）
     设计：全凭文字表现 —— 碑石匾额 / 竖排铭文 / 朱印
     2026-09-23 00:0x 老板令「尝试使用文字表现手法…古朴文字气息」
     ───────────────────────────────────────────── */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:#07080a;
    background-image:
      radial-gradient(1100px 700px at 50% 4%,#1a1c1f 0%,#0b0c0e 58%,#07080a 100%),
      radial-gradient(760px 460px at 50% 104%,#141310 0%,rgba(7,8,10,0) 72%);
    color:#ded5bd;font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
    display:flex;flex-direction:column;align-items:center;
    padding:30px 20px calc(22px + env(safe-area-inset-bottom));
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow-x:hidden;
  }
  /* 碑拓/纸张颗粒(纯 CSS 叠层, 无外链资源) */
  .grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.09;mix-blend-mode:overlay;z-index:9}

  header{text-align:center;margin-top:2px}
  .brand{font-size:15px;letter-spacing:.62em;text-indent:.62em;color:#a89a76}
  .brand small{display:block;font-size:10.5px;letter-spacing:.42em;text-indent:.42em;color:#6e6857;margin-top:7px;font-family:ui-monospace,Menlo,monospace}

  /* 匾额: 碑石(浅) + 阴刻大字 */
  .plaque{
    position:relative;margin:22px auto 0;padding:20px 26px 17px;border-radius:4px;
    background:linear-gradient(168deg,#e7e0ca 0%,#d8d0b8 52%,#c8bfa5 100%);
    box-shadow:0 18px 46px rgba(0,0,0,.62),inset 0 0 26px rgba(120,104,66,.28);
    border:1px solid #6c6350;
  }
  .plaque:before{content:"";position:absolute;inset:7px;border:1px solid rgba(58,50,32,.55);border-radius:2px;pointer-events:none}
  .plaque:after{content:"";position:absolute;inset:11px;border:1px solid rgba(58,50,32,.26);border-radius:1px;pointer-events:none}
  .plaque b{
    position:relative;display:block;font-size:54px;line-height:1;letter-spacing:.2em;text-indent:.2em;font-weight:600;
    color:#3a3122;
    text-shadow:0 1px 0 rgba(255,251,238,.85),0 -1px 1px rgba(46,38,22,.55),0 2px 3px rgba(46,38,22,.28);
  }
  .plaque .cap{display:block;margin-top:11px;font-size:10.5px;letter-spacing:.46em;text-indent:.46em;color:#6b6047;font-family:ui-monospace,Menlo,monospace}

  /* 竖排铭文 */
  .verse{margin:26px auto 0;writing-mode:vertical-rl;text-orientation:upright;
    font-size:14.5px;letter-spacing:.30em;line-height:2.05;color:#cdc3a8;opacity:.94;
    height:auto;max-height:270px}
  .verse div{display:block;margin-left:20px}
  .verse b{font-weight:400;color:#e6dcc0}
  .verse i{font-style:normal;color:#8b8266}

  .rule{width:150px;height:1px;margin:22px auto 0;
    background:linear-gradient(90deg,rgba(201,162,83,0),rgba(201,162,83,.7),rgba(201,162,83,0))}

  /* 朱印(按住启门) */
  .sealbox{position:relative;width:150px;height:150px;margin:22px auto 4px;display:flex;align-items:center;justify-content:center}
  .halo{position:absolute;inset:0;border-radius:10px;
    background:radial-gradient(circle,rgba(180,52,40,.20) 0%,rgba(180,52,40,0) 70%);
    transition:opacity .5s ease,transform .5s ease;opacity:.8}
  .rring{position:absolute;inset:0;width:100%;height:100%}
  .rring .trk{fill:none;stroke:rgba(201,162,83,.14);stroke-width:1.6}
  .rring .pty{fill:none;stroke:#e6c073;stroke-width:2.4;stroke-linejoin:round;transition:stroke-dashoffset .08s linear}
  .seal{
    position:relative;width:112px;height:112px;border-radius:6px;
    background:linear-gradient(158deg,#95211b,#701511 60%,#540d0a);
    border:2px solid #bb4a3e;
    box-shadow:0 12px 30px rgba(0,0,0,.6),inset 0 0 20px rgba(255,180,120,.12);
    display:flex;align-items:center;justify-content:center;
    font-size:62px;line-height:1;color:#f4dfb6;
    text-shadow:0 -1px 0 rgba(0,0,0,.5),0 1px 0 rgba(255,226,180,.28);
    transition:transform .16s ease,box-shadow .3s ease,filter .3s ease;cursor:pointer
  }
  .seal:active{transform:scale(.97)}
  .seal.hold{filter:brightness(1.14)}
  .seal.open{transform:scale(1.06);box-shadow:0 0 64px rgba(230,192,115,.5),0 12px 30px rgba(0,0,0,.55)}
  .hint{margin-top:14px;font-size:13px;letter-spacing:.2em;color:#b6ad93;text-align:center;min-height:19px}
  .hint.bad{color:#e8a0a0}.hint.ok{color:#9fd7a6}
  .state{margin-top:14px;font-size:11.5px;letter-spacing:.1em;color:#7f7963;text-align:center;min-height:17px}
  .state.ok{color:#9fd7a6}.state.bad{color:#e8a0a0}
  .spin{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;
    border:2px solid rgba(201,162,83,.35);border-top-color:#e6c073;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .motto{margin-top:16px;font-size:12.5px;letter-spacing:.34em;text-indent:.34em;color:#8b8268}

  .foot{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;z-index:10}
  .btns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .btns a,.btns button{font-family:inherit;font-size:12px;letter-spacing:.08em;color:#c2b99f;
    background:rgba(255,255,255,.04);border:1px solid rgba(201,162,83,.3);
    border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none}
  .btns a:active,.btns button:active{background:rgba(201,162,83,.15);color:#f0e2be}
  .diag{font-size:10px;letter-spacing:.03em;color:#565246;text-align:center;
    font-family:ui-monospace,Menlo,monospace;max-width:330px;line-height:1.5}
</style>
</head>
<body>
  <svg class="grain" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#gr)"/></svg>

  <header>
    <div class="brand">玄武灵犀<small>觀 天 下 · 內 門</small></div>
  </header>

  <div class="plaque">
    <b>玄武</b>
    <span class="cap">北 宮 之 象 · 龜 蛇 相 纏</span>
  </div>

  <div class="verse">
    <div>玄者幽遠<i>、</i>武者止戈</div>
    <div>北宮龜蛇<i>、</i>主水主藏</div>
    <div>藏而後動<i>、</i>動則有定</div>
  </div>

  <div class="rule"></div>

  <div class="sealbox">
    <div class="halo" id="halo"></div>
    <svg class="rring" viewBox="0 0 150 150" aria-hidden="true">
      <rect class="trk" x="8" y="8" width="134" height="134" rx="9"></rect>
      <rect class="pty" id="pty" x="8" y="8" width="134" height="134" rx="9"
            stroke-dasharray="521" stroke-dashoffset="521"></rect>
    </svg>
    <div class="seal" id="seal">開</div>
  </div>

  <div class="hint" id="hint">按住「開」字 1.2 秒 · 門 自 開</div>
  <div class="state" id="state"><span class="spin"></span>門 · 正在校准线路…</div>
  <div class="motto">一 門 常 駐 · 唯 手 可 啟</div>

  <div class="foot">
    <div class="btns">
      <button id="refresh">🔁 校准新址</button>
      <button id="local">🖥 本机直连</button>
      <a href="../">← 观天下</a>
    </div>
    <div class="diag" id="diag"></div>
  </div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var HOLD = 1200, PER = 521;                 // 按住 1.2 秒; 方框周长
  var target = null, ready = false, opened = false;
  var t0 = 0, raf = 0, held = false;
  var pty = $('pty');

  function say(s, cls){ var e=$('state'); e.className='state'+(cls?(' '+cls):''); e.innerHTML=s; }
  function hint(s, cls){ var e=$('hint'); e.className='hint'+(cls?(' '+cls):''); e.textContent=s; }
  function busy(s){ say('<span class="spin"></span>'+s); }
  function ring(p){ pty.setAttribute('stroke-dashoffset', String(PER*(1-p))); }
  function glow(on){ $('halo').style.opacity = on?1:.8; $('halo').style.transform = on?'scale(1.05)':'scale(1)'; }

  function fetchTarget(){
    return fetch('../url.json?t='+new Date().getTime(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ return (j && j.url) ? String(j.url).replace(/\/+$/,'') : null; });
  }
  function probe(u){
    if (!window.fetch) return Promise.resolve(true);
    var ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    var timer = setTimeout(function(){ if(ctl) ctl.abort(); }, 8000);
    return fetch(u+'/health', {mode:'cors', cache:'no-store', signal: ctl?ctl.signal:undefined})
      .then(function(r){ clearTimeout(timer); if(!r.ok) return false;
        return r.json().then(function(j){ return !!(j&&j.ok); }, function(){ return false; }); })
      .catch(function(){ clearTimeout(timer); return false; });
  }
  function calibrate(depth){
    depth = depth || 0;
    busy('門 · 正在校准线路…');
    return fetchTarget().then(function(u){
      if (!u) throw new Error('NOPKG');
      target = u;
      return probe(u).then(function(alive){
        if (alive){ ready = true; glow(true); ring(1); say('門 · 已就绪 · 按住启门','ok'); return true; }
        if (depth < 2) return new Promise(function(r){ setTimeout(r, 2500); }).then(function(){ return calibrate(depth+1); });
        ready = false; ring(0); glow(false);
        say('⚠️ 线路刚更换 · 请点「🔁 校准新址」','bad'); return false;
      });
    }).catch(function(){
      ready = false; ring(0); glow(false);
      say('⚠️ 暂时校不到线路 · 稍后再试','bad'); return false;
    });
  }

  function open(){
    if (opened || !ready || !target) return;
    opened = true; $('seal').className = 'seal open'; glow(true);
    hint('門 已 開 · 請 入','ok'); say('正在进入 · 玄武灵犀…','ok');
    setTimeout(function(){ location.replace(target + '/m.html'); }, 750);
  }

  function tick(){
    if (!held) return;
    var dt = new Date().getTime() - t0, p = dt / HOLD;
    if (p > 1) p = 1;
    ring(p);
    if (p >= 1){
      if (ready) { open(); return; }
      held = false; $('seal').className='seal'; ring(0); glow(false);
      hint('线路未就绪 · 正在校准，请稍候再按','bad'); calibrate(0); return;
    }
    raf = requestAnimationFrame(tick);
  }
  function pressStart(ev){
    if (opened) return;
    if (ev && ev.preventDefault) ev.preventDefault();
    held = true; t0 = new Date().getTime();
    $('seal').className = 'seal hold';
    hint('收 手 則 門 閉 · 請 按 住 不 放');
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }
  function pressEnd(){
    if (opened || !held) return;
    var dt = new Date().getTime() - t0;
    held = false; $('seal').className = 'seal'; ring(0); glow(ready);
    if (dt < HOLD) hint('按住「開」字 1.2 秒 · 門 自 開');
  }

  var seal = $('seal');
  seal.addEventListener('touchstart', pressStart, {passive:false});
  seal.addEventListener('touchend', pressEnd);
  seal.addEventListener('touchcancel', pressEnd);
  seal.addEventListener('mousedown', pressStart);
  seal.addEventListener('mouseup', pressEnd);
  seal.addEventListener('mouseleave', pressEnd);
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });

  $('refresh').addEventListener('click', function(){ ready=false; ring(0); glow(false); calibrate(0); });
  $('local').addEventListener('click', function(){ location.href = 'http://127.0.0.1:8092/m.html'; });

  setInterval(function(){ if (!ready && !opened) calibrate(2); }, 15000);

  (function diag(){
    var ua = (navigator.userAgent||''), br = '未知';
    if (/EdgA?\//.test(ua)) br='Edge';
    else if (/Chrome\//.test(ua)) br='Chrome';
    else if (/Firefox\//.test(ua)) br='Firefox';
    else if (/Safari\//.test(ua)) br='Safari';
    var tip = ('ontouchstart' in window) ? '触屏' : '鼠标';
    var crypto_ok = !!(window.crypto && (window.crypto.subtle||window.crypto.webkitSubtle));
    var net = (navigator.onLine===false) ? '离线' : '在线';
    $('diag').textContent = '门体自检 · ' + location.protocol + ' · ' + br + ' · ' + tip + ' · 网络' + net +
      ' · 抓取' + (window.fetch?'可用':'不可用') + ' · 加密' + (crypto_ok?'可用':'不可用');
  })();

  calibrate(0);
})();
</script>
</body>
</html>
