<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>玄武灵犀 · 固定入口</title>
<!-- 🏠20260923 回滚: 复原「创建初期」固定入口页长相(单卡·居中·自动跳转最新可用入口)
     改动只有一处: 地址源不再是明文 url.json(已取缔)，改为本机直连台探活 -->
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--ok:#3fb950}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;max-width:520px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  h1{font-size:19px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .st{font-size:15px;margin:10px 0;min-height:24px}
  .ok{color:var(--ok)} .dim{color:var(--dim)}
  a.btn{display:block;background:var(--acc);color:#0d1117;text-decoration:none;font-weight:700;padding:13px;border-radius:10px;margin-top:14px}
  code{background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px;color:var(--dim);word-break:break-all}
  .row{margin-top:12px;font-size:13px}
  .row a{color:var(--acc);text-decoration:none;margin:0 7px}
  .foot{margin-top:14px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="card">
  <h1>🐉 玄武灵犀 · 固定入口</h1>
  <div class="sub">本页会自动打开最新可用的入口</div>
  <div class="st" id="st"><span class="dim">正在检查入口…</span></div>
  <a class="btn" id="btn" href="http://127.0.0.1:8094/" style="display:none">👉 打开管理台</a>
  <div class="row">
    <a href="read/">📖 读本</a>·
    <a href="live/">📈 实况</a>·
    <a href="disk/">💽 硬盘</a>·
    <a href="http://127.0.0.1:8094/">🖥 管理台</a>
  </div>
  <div class="foot">当前目标：<code id="u">http://127.0.0.1:8094/</code><br><span id="t">本页于 2026-09-23 15:57 刷新 · 只读入口</span></div>
</div>
<script>
(function(){
  var LOCAL='http://127.0.0.1:8094/';
  var st=document.getElementById('st'),btn=document.getElementById('btn'),te=document.getElementById('t');
  btn.href=LOCAL;
  function go(){
    st.innerHTML='<span class="ok">✅ 本机台在线，正在打开…</span>';
    btn.style.display='block';
    setTimeout(function(){location.replace(LOCAL)},700);
  }
  // 探活本机台(手机上的台; 只在确认在线时才自动跳转, 与创建初期同一逻辑)
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=setTimeout(function(){ if(ctl) ctl.abort(); },2500);
  fetch(LOCAL+'health',{mode:'cors',cache:'no-store',signal:ctl?ctl.signal:undefined})
    .then(function(r){clearTimeout(timer);return r.ok?r.json():null})
    .then(function(j){ if(j&&j.ok){ go(); } else { miss(); } })
    .catch(function(){ clearTimeout(timer); miss(); });
  function miss(){
    st.innerHTML='<span class="dim">本机台未响应（先把手机上的台开起来，或点下面的入口）</span>';
    btn.style.display='block';
    te.textContent='本页于 2026-09-23 15:57 刷新 · 只读入口';
  }
})();
</script>
</body>
</html>
